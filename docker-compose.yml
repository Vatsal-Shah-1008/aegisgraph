version: '3.8'

services:
  aegisgraph-app:
    build: .
    container_name: aegisgraph_platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=*
    env_file:
      - .env

  # Optional Nginx Reverse Proxy for Custom Domain & Let's Encrypt SSL
  nginx-proxy:
    image: nginx:alpine
    container_name: aegisgraph_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - aegisgraph-app
